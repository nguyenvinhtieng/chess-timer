<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#101310">
<title>Game Clock</title>
<style>
:root{color-scheme:dark;--gold:#c7c9c2;--green:#d2d4cd;--red:#e66f62}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 42%,#34302d 0,#211e1c 55%,#111 100%);color:#f2f0e8;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100svh;display:grid;place-items:center;padding:16px}
.app{width:min(100%,1200px)}.top{display:flex;align-items:center;justify-content:flex-end;margin:0 4px 10px}.brand{display:none}.iconbtn,.btn{border:1px solid #544b46;background:#302b28;color:#e4ded9;border-radius:9px;padding:10px 14px;font:inherit;cursor:pointer;transition:.15s}.iconbtn:hover,.btn:hover{border-color:#887a70;background:#39332f}.iconbtn{width:42px;height:42px;font-size:18px;padding:0}.board{display:grid;grid-template-columns:1fr 1fr;gap:0;position:relative;border:8px solid #382d29;border-radius:34px;padding:7px;background:linear-gradient(145deg,#78645e,#453632 30%,#241c1a 72%,#594740);box-shadow:0 28px 70px #000b,inset 0 2px #ffffff35,inset 0 -7px #0006;overflow:hidden}.board:after{content:"";position:absolute;z-index:2;left:50%;top:7%;height:86%;width:5px;transform:translateX(-50%);border-radius:9px;background:#171514;box-shadow:1px 0 #ffffff18,-1px 0 #000}.player{position:relative;min-height:clamp(300px,42svh,560px);padding:16px 20px 30px;border-radius:17px;display:flex;flex-direction:column;justify-content:center;gap:10px;overflow:hidden;cursor:pointer;user-select:none;touch-action:manipulation;transition:background .2s,transform .15s}.player:active{filter:brightness(1.2)}.player.upper{background:linear-gradient(145deg,#302923,#211e1d);transform:none}.player.lower{background:linear-gradient(145deg,#3b342e,#292421)}.player.active{background:linear-gradient(145deg,#4c5443,#33392f);box-shadow:inset 0 0 0 2px #c7c9c277,inset 0 0 45px #fff2}.player.expired{background:linear-gradient(145deg,#452a27,#301f1d)}.identity{display:none}.avatar{display:none}.pname{display:none}.turn{display:none}.time{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-size:clamp(60px,12vw,150px);line-height:1;font-weight:650;letter-spacing:.015em;text-align:center;color:#e9e6e1;text-shadow:0 2px 16px #0008;white-space:nowrap}.millis{font-size:.32em;vertical-align:baseline;letter-spacing:0;font-weight:500;opacity:.72;margin-left:2px}.active .time{color:#fbfaf6}.expired .time{color:#f08c7d}.subrow{display:none}.bar{position:absolute;bottom:0;left:0;right:0;height:4px;background:#ffffff18;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .2s}.controls{display:flex;justify-content:center;align-items:center;gap:10px;padding:15px 0 0}.mainbtn{background:linear-gradient(#ebe7df,#bdb6ac);border:1px solid #aaa095;color:#211b18;padding:12px 25px;min-width:142px;border-radius:9px;font:700 13px ui-sans-serif,system-ui,sans-serif;letter-spacing:.04em;cursor:pointer;box-shadow:0 3px 9px #0006}.mainbtn:hover{background:#fff}.hint{display:none}.hint kbd{display:none}
dialog{width:min(92vw,390px);border:1px solid #444a3e;border-radius:20px;background:#1b1f1a;color:#eee;padding:23px;box-shadow:0 24px 80px #000b}dialog::backdrop{background:#0009;backdrop-filter:blur(4px)}dialog h2{font-size:17px;margin:0 0 4px}dialog p{font-size:12px;color:#949b91;margin:0 0 20px}.field{margin:15px 0}.field label{display:block;color:#b7bcb2;font-size:12px;margin-bottom:8px}.stepper{display:flex;align-items:center;justify-content:space-between;border:1px solid #383e35;background:#141713;border-radius:11px;padding:5px}.stepper button{width:38px;height:34px;border:0;border-radius:8px;background:#242a22;color:#eee;font-size:19px;cursor:pointer}.stepper output{font-size:16px;font-variant-numeric:tabular-nums}.dialog-actions{display:flex;gap:9px;margin-top:23px}.dialog-actions button{flex:1}.primary{background:var(--gold);border-color:var(--gold);color:#181812;font-weight:700}.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;pointer-events:none;border:1px solid #555a4d;border-radius:12px;padding:11px 16px;background:#21251f;color:#efeee7;font-size:13px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(orientation:portrait){body{min-height:100svh;height:100svh;padding:8px;overflow:hidden}.app{width:100%;height:100%;display:grid;grid-template-rows:42px minmax(0,1fr) 48px;gap:8px}.top{position:static;justify-content:flex-end;margin:0;height:42px}.board{width:100%;height:100%;min-height:0;margin:0;grid-template-columns:1fr;grid-template-rows:1fr 1fr;transform:none;border-width:6px;border-radius:25px;padding:5px}.board:after{left:5%;top:50%;width:90%;height:5px;transform:translateY(-50%)}.player{min-height:0;padding:8px 8px 12px;gap:8px}.time{font-size:clamp(52px,17vw,108px);font-weight:700}.controls{position:static;padding:0}.controls .btn,.mainbtn{padding:9px 14px;min-width:unset}.mainbtn{min-width:112px}}
@media(orientation:landscape){body{height:100svh;min-height:100svh;padding:8px}.app{width:100%;height:100%;display:grid;grid-template-rows:36px minmax(0,1fr) 44px;gap:6px}.top{height:36px;margin:0}.board{width:100%;height:100%;min-height:0;margin:0;grid-template-columns:1fr 1fr;grid-template-rows:1fr;transform:none;border-width:6px;border-radius:25px;padding:5px}.board:after{left:50%;top:5%;height:90%;width:5px;transform:translateX(-50%)}.player{min-height:0;padding:8px 10px 12px;gap:8px}.time{font-size:clamp(42px,18vh,150px)}.controls{position:static;padding:0}.controls .btn,.mainbtn{padding:8px 14px;min-width:unset}.mainbtn{min-width:112px}}
</style>
</head>
<body>
<main class="app">
<header class="top"><div class="brand"><div class="mark">♞</div><div><strong>CHESS CLOCK</strong><small>Đồng hồ cờ vua</small></div></div><button class="iconbtn" id="settings" aria-label="Cài đặt" title="Cài đặt">⚙</button></header>
<section class="board" aria-label="Đồng hồ cờ vua">
  <div class="player upper" id="blackCard" role="button" tabindex="0" aria-label="Chuyển lượt sang Đen"><div class="identity"><div class="avatar">♚</div><div><div class="pname">Đen</div><div class="turn" id="blackTurn">SẴN SÀNG</div></div></div><div class="time" id="blackTime">10:00<small class="millis">.000</small></div><div><div class="subrow"><span id="blackMeta">+ 0 giây / nước</span><span id="blackMoves">0 nước</span></div><div class="bar"><i id="blackBar"></i></div></div></div>
  <div class="player lower" id="whiteCard" role="button" tabindex="0" aria-label="Chuyển lượt sang Trắng"><div class="identity"><div class="avatar">♔</div><div><div class="pname">Trắng</div><div class="turn" id="whiteTurn">SẴN SÀNG</div></div></div><div class="time" id="whiteTime">10:00<small class="millis">.000</small></div><div><div class="subrow"><span id="whiteMeta">+ 0 giây / nước</span><span id="whiteMoves">0 nước</span></div><div class="bar"><i id="whiteBar"></i></div></div></div>
</section>
<div class="controls"><button class="btn" id="reset" title="Ván mới">↺</button><button class="mainbtn" id="start">BẮT ĐẦU</button><button class="btn" id="swap" title="Đổi bên bắt đầu">⇅</button></div>
<div class="hint">Chạm đồng hồ bên bạn để kết thúc lượt · <kbd>Space</kbd> đổi lượt · <kbd>Esc</kbd> tạm dừng</div>
</main>
<dialog id="settingsDialog"><h2>Cài đặt thời gian</h2><p>Chọn thời lượng ban đầu và increment cho mỗi bên.</p>
<div class="field"><label>Thời gian bên 1</label><div class="stepper"><button data-field="white" data-delta="-30">−</button><output id="whiteOut">10:00</output><button data-field="white" data-delta="30">+</button></div></div><div class="field"><label>Thời gian bên 2</label><div class="stepper"><button data-field="black" data-delta="-30">−</button><output id="blackOut">10:00</output><button data-field="black" data-delta="30">+</button></div></div>
<div class="field"><label>Increment mỗi nước</label><div class="stepper"><button data-field="increment" data-delta="-1">−</button><output id="incrementOut">0 giây</output><button data-field="increment" data-delta="1">+</button></div></div>
<div class="dialog-actions"><button class="btn" id="cancelSettings">Huỷ</button><button class="btn primary" id="saveSettings">Lưu cài đặt</button></div></dialog><div class="toast" id="toast"></div>
<script>
(()=>{
const $=id=>document.getElementById(id), cards={white:$('whiteCard'),black:$('blackCard')};
let config={white:600,black:600,increment:0},remaining={white:600000,black:600000},moves={white:0,black:0},active=null,running=false,started=false,last=0,raf=0,starter='white';
const fmt=ms=>{let t=Math.max(0,Math.floor(ms)),s=Math.floor(t/1000),m=Math.floor(s/60),r=s%60,frac=String(t%1000).padStart(3,'0');return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}<small class=\"millis\">.${frac}</small>`};
function render(){for(const side of ['white','black']){const cap=config[side]*1000;$(side+'Time').innerHTML=fmt(remaining[side]);$(side+'Moves').textContent=`${moves[side]} nước`;$(side+'Meta').textContent=`+ ${config.increment} giây / nước`;$(side+'Turn').textContent=remaining[side]<=0?'HẾT GIỜ':active===side?(running?'ĐANG ĐI':'TẠM DỪNG'):started?'ĐẾN LƯỢT':'SẴN SÀNG';$(side+'Bar').style.width=`${Math.max(0,Math.min(100,remaining[side]/cap*100))}%`;cards[side].classList.toggle('active',active===side&&running);cards[side].classList.toggle('expired',remaining[side]<=0)}}
function tick(now){if(!running)return;const dt=Math.min(now-last,1000);last=now;remaining[active]-=dt;if(remaining[active]<=0){remaining[active]=0;running=false;active=null;started=true;render();toast('Hết giờ!');return}render();raf=requestAnimationFrame(tick)}
function other(side){return side==='white'?'black':'white'}
function start(){if(running)return;if(!started){active=other(starter);started=true}if(!active)return;running=true;last=performance.now();render();raf=requestAnimationFrame(tick)}
function pause(){if(!running)return;running=false;cancelAnimationFrame(raf);render()}
function press(side){if(!started){starter=side;start();return}if(!running||active!==side)return;remaining[side]+=config.increment*1000;moves[side]++;active=other(side);last=performance.now();render()}
function reset(){pause();remaining={white:config.white*1000,black:config.black*1000};moves={white:0,black:0};active=null;started=false;render()}
function toast(text){const el=$('toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2100)}
$('start').onclick=()=>running?pause():start();$('reset').onclick=()=>{reset();toast('Đã tạo ván mới')};$('swap').onclick=()=>{if(started){toast('Hãy tạo ván mới để đổi bên bắt đầu');return}starter=starter==='white'?'black':'white';toast(`Bên ${starter==='white'?'Trắng':'Đen'} đi trước`)};
for(const side of ['white','black']){cards[side].onclick=()=>press(side);cards[side].onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();press(side)}}}
document.addEventListener('keydown',e=>{if(e.code==='Space'&&document.activeElement.tagName!=='BUTTON'){e.preventDefault();if(!started){starter='white';start()}else if(running)press(active);else start()}if(e.key==='Escape'&&$('settingsDialog').open){}else if(e.key==='Escape')pause()});
const dlg=$('settingsDialog'), clockLabel=seconds=>`${Math.floor(seconds/60)}:${String(seconds%60).padStart(2,'0')}`;function updateSettings(){for(const side of ['white','black'])$(side+'Out').textContent=clockLabel(config[side]);$('incrementOut').textContent=`${config.increment} giây`}$('settings').onclick=()=>{updateSettings();dlg.showModal()};document.querySelectorAll('[data-field]').forEach(btn=>btn.onclick=()=>{const key=btn.dataset.field;if(key==='white'||key==='black')config[key]=Math.max(30,Math.min(10800,config[key]+Number(btn.dataset.delta)));else config.increment=Math.max(0,Math.min(120,config.increment+Number(btn.dataset.delta)));updateSettings()});$('cancelSettings').onclick=()=>dlg.close();$('saveSettings').onclick=()=>{reset();dlg.close();toast('Đã lưu cài đặt')};$('start').textContent='BẮT ĐẦU';const renderBase=render;render=()=>{renderBase();$('start').textContent=running?'TẠM DỪNG':started?'TIẾP TỤC':'BẮT ĐẦU'};render();
})();
</script>
</body>
</html>
